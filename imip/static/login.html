<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Mundo Mágico - Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .botao-crianca { background-color: #FFCF00; border-bottom: 8px solid #D4AC00; }
        .botao-professor { background-color: #4FB3FF; border-bottom: 8px solid #3A8BCC; }
        .card { border-radius: 40px; }
    </style>
</head>
<body class="bg-gradient-to-r from-purple-400 via-pink-300 to-red-300 min-h-screen flex items-center justify-center font-sans">

    <div class="bg-white p-10 card shadow-2xl text-center max-w-sm w-full">
        <h1 class="text-4xl font-black text-purple-600 mb-8">Olá! 👋</h1>
        
        <form action="/login" method="POST" class="space-y-6">
            <div class="flex gap-4 mb-6">
                <!-- Seleção visual -->
                <label class="cursor-pointer flex-1">
                    <input type="radio" name="tipo_selecionado" value="aluno" class="hidden peer" checked>
                    <div class="p-4 rounded-2xl border-4 border-transparent peer-checked:border-yellow-400 bg-yellow-100">
                        <span class="block text-3xl">🧒</span>
                        <span class="font-bold text-yellow-700">Aluno</span>
                    </div>
                </label>

                <label class="cursor-pointer flex-1">
                    <input type="radio" name="tipo_selecionado" value="professor" class="hidden peer">
                    <div class="p-4 rounded-2xl border-4 border-transparent peer-checked:border-blue-400 bg-blue-100">
                        <span class="block text-3xl">👩‍🏫</span>
                        <span class="font-bold text-blue-700">Profe</span>
                    </div>
                </label>
            </div>

            <input type="text" name="usuario" placeholder="Seu nome" class="w-full p-4 rounded-2xl bg-gray-100 border-none text-lg">
            <input type="password" name="senha" placeholder="Sua senha" class="w-full p-4 rounded-2xl bg-gray-100 border-none text-lg">
            
            <button type="submit" class="w-full p-4 botao-crianca text-white font-bold text-2xl rounded-2xl transform active:scale-95 transition">
                ENTRAR NO MUNDO! 🚀
            </button>
        </form>
    </div>

</body>
</html>
